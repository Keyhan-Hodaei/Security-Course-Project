services:
  validate:
    build: .
    image: patchprobe:latest
    # Container resource limits provide kernel-level isolation for target runs
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    read_only: false
    # Small temporary filesystem to limit disk growth from malformed inputs
    tmpfs:
      - /tmp:size=1g,mode=1777,exec
    cap_drop: [ALL]
    # Note: Docker installed through snap (Ubuntu) can reject this setting
    # because of its AppArmor policy (exec ...: operation not permitted).
    # In that case remove only these two lines; standard Docker Engine supports it.
    security_opt:
      - no-new-privileges:true
    # Disable networking completely: target programs must not access the network
    network_mode: none
    working_dir: /workspace
    command: bash -c "python3 -m pytest tests/ -q && bash scenarios/run_all.sh"
