name: patchprobe-validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: ابزارها
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils gcc make
          python -m pip install -q pytest
          gcc --version | head -1
      - name: آزمون‌های واحد
        run: python -m pytest tests/ -q

  scenarios:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: jsoncheck, base: main, patched: patch-correct,     expect: 0,  name: correct}
          - {target: jsoncheck, base: main, patched: patch-incomplete,  expect: 10, name: incomplete}
          - {target: jsoncheck, base: main, patched: patch-regression,  expect: 20, name: regression}
          - {target: jsoncheck, base: main, patched: patch-newissue,    expect: 10, name: newissue}
          - {target: jsoncheck, base: main, patched: patch-mixed,       expect: 10, name: mixed-priority}
          - {target: jsoncheck, base: patch-correct, patched: patch-regression, expect: 20, name: fixedbase-regression}
          - {target: jsoncheck, base: patch-regression, patched: patch-correct, expect: 40, name: nonrepro}
          - {target: jsoncheck, base: main, patched: build-broken,      expect: 30, name: buildbroken}
          - {target: imginfo,   base: main, patched: patch-correct,     expect: 0,  name: correct}
          - {target: imginfo,   base: main, patched: patch-incomplete,  expect: 10, name: incomplete}
          - {target: imginfo,   base: main, patched: patch-regression,  expect: 20, name: regression}
          - {target: imginfo,   base: patch-correct, patched: patch-regression, expect: 20, name: fixedbase-regression}
          - {target: imginfo,   base: patch-regression, patched: patch-correct, expect: 40, name: nonrepro}
          - {target: imginfo,   base: main, patched: build-broken,      expect: 30, name: buildbroken}
    name: ${{ matrix.target }}/${{ matrix.name }} → ${{ matrix.expect }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: بازیابی مخزن‌های هدف از git bundle
        run: bash scripts/setup_targets.sh
      - name: اعتبارسنجی وصله (کد خروج = معیار تصمیم)
        shell: bash
        run: |
          set +e
          python -m patchprobe --config "targets/${{ matrix.target }}/config.json" \
            --base-ref "${{ matrix.base }}" --patched-ref "${{ matrix.patched }}" \
            --reports-dir "reports/${{ matrix.target }}/${{ matrix.name }}" \
            --bundles-dir "bundles/${{ matrix.target }}/${{ matrix.name }}"
          got=$?
          echo "کد خروج PatchProbe: $got (انتظار: ${{ matrix.expect }})"
          [ "$got" -eq "${{ matrix.expect }}" ]
      - name: بایگانی گزارش‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.target }}-${{ matrix.name }}
          path: |
            reports/
            regression/
            bundles/

  # نمونه دروازه واقعی انتشار: فقط کد 0 اجازه انتشار می‌دهد
  release-gate-example:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/setup_targets.sh
      - name: وصله درست jsoncheck باید از دروازه عبور کند
        run: |
          python3 -m patchprobe --config targets/jsoncheck/config.json \
            --base-ref main --patched-ref patch-correct
